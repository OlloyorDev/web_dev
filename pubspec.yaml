name: web_devop
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^16.2.5
  intl: ^0.20.2
  get_it: ^8.2.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.2.0
  firebase_remote_config: ^6.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/locale/
    - assets/fonts/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
