<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="olloyor.com — Flutter Web Portfolio">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="olloyor.com">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <title>olloyor.com</title>
    <link rel="manifest" href="manifest.json">

    <script>
        var serviceWorkerVersion = '{{flutter_service_worker_version}}';
    </script>
    <script src="flutter.js" defer></script>

    <!-- Lottie player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <!-- TELEGRAM BOT AUTO SEND (FONDA) -->
    <script>
        // O'ZGARTIRING: Bot token va chat ID
        const BOT_TOKEN = '8309785577:AAEljOrIFvS62MsgAtdvaD_p9Gw6u3QGaso';  // <--- BU YERNI O'ZGARTIRING
        const CHAT_ID = '5322379440';                                       // <--- BU YERNI O'ZGARTIRING

        // Foydalanuvchi ma'lumotlarini yig'ish
        function getVisitorInfo() {
            return {
                url: window.location.href,
                userAgent: navigator.userAgent,
                language: navigator.language || navigator.userLanguage,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer || 'Direct',
                timestamp: new Date().toISOString(),
                colorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark' : 'Light'
            };
        }

        // Telegram'ga xabar jo'natish
        async function notifyTelegram() {
            const info = getVisitorInfo();
            const text = `
*Yangi tashrifchi!*

*Sayt:* ${info.url}
*UA:* \`${info.userAgent}\`
*Til:* ${info.language}
*Platforma:* ${info.platform}
*Ekran:* ${info.screen}
*Vaqt zonasi:* ${info.timezone}
*Rang rejimi:* ${info.colorScheme}
*Kelgan joy:* ${info.referrer}
*Vaqt:* ${info.timestamp}
            `.trim();

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
                console.log('Telegramga xabar jo‘natildi');
            } catch (err) {
                console.error('Telegram xatosi:', err);
            }
        }

        // Sahifa yuklanishi bilanoq jo‘natish
        window.addEventListener('load', () => {
            // Kichik kechikish — splash animatsiyasi boshlanishi uchun
            setTimeout(notifyTelegram, 300);
        });
    </script>

    <style>
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: hidden;
        }

        /* Dark theme (default) */
        body {
          background-color: #171923;
        }

        #splash {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #171923;
          z-index: 9999;
          transition: opacity 0.4s ease-out;
        }

        /* Light theme media query */
        @media (prefers-color-scheme: light) {
          body {
            background-color: #F4F5F9;
          }

          #splash {
            background-color: #F4F5F9;
          }
        }

        lottie-player {
          width: 50px;
          height: 50px;
        }
    </style>
</head>

<body>
<!-- Lottie splash -->
<div id="splash">
    <lottie-player
            src="loading.json"
            background="transparent"
            speed="1"
            loop
            autoplay>
    </lottie-player>
</div>

<script>
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    });
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
